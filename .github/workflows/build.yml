name: Build and test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native tests
        run: |
          cmake -S app/src/main/cpp -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j4 --target core_test
          ./build-host/core_test

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM unit tests (Hinglish, links, stream choice, moment selection)
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-report, path: app/build/reports/tests }

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build optimised release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Keep APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ShortsMaker.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: ShortsMaker-apk, path: dist/ShortsMaker.apk }

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test assets (speech model + test video)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p app/src/androidTest/assets
          curl -L --fail --retry 3 -o app/src/androidTest/assets/model.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          ls -la app/src/androidTest/assets/model.bin
          ffmpeg -y -f lavfi -i "color=c=0x00aa00:s=1280x720:r=30:d=12" -i tools/jfk.wav \
            -vf "drawbox=x=0:y=0:w=1280:h=720:color=white:t=8" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 44100 -ac 2 -shortest app/src/androidTest/assets/test.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 app/src/androidTest/assets/test.mp4
          # 78 s "YouTube-like" source: JFK speech x6 with pauses, delivered as separate picture and sound files
          ffmpeg -y -i tools/jfk.wav -af "apad=pad_dur=2.5" -ar 44100 -ac 2 unit.wav
          ffmpeg -y -stream_loop 5 -i unit.wav -t 78 -c:a aac -b:a 128k -f ipod app/src/androidTest/assets/audio_only.m4a
          ffmpeg -y -f lavfi -i "testsrc2=s=1280x720:r=30:d=78" -c:v libx264 -pix_fmt yuv420p -an app/src/androidTest/assets/video_only.mp4
          ls -la app/src/androidTest/assets
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            adb logcat -c
            ./gradlew --no-daemon connectedDebugAndroidTest || echo "TESTS_FAILED" > test_failed.flag
            adb logcat -d -s PROOF:I Mux:I Download:W PIPE:I SIZE:I YTLIVE:I ShortsNative:I AndroidRuntime:E > logcat_proof.txt || true
            mkdir -p proof_out
            adb pull /sdcard/Android/data/com.shortsmaker.proof/files/proof proof_out/ || true
            test ! -f test_failed.flag
      - name: Show test log
        if: always()
        run: cat logcat_proof.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: |
            logcat_proof.txt
            proof_out
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  publish:
    needs: [native-host-test, unit-tests, apk, emulator-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ShortsMaker-apk, path: dist }
      - name: Publish download link (only because every test passed)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ShortsMaker.apk --title "Shorts Maker (latest tested build)" \
            --notes "Commit ${{ github.sha }}. Published only after native, unit and emulator tests passed."
